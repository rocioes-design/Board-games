name: Update games from BoardGameGeek

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # every Monday morning (UTC)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the image resizer
        run: npm install --no-save --no-package-lock sharp@0.34.5
      - run: node scripts/fetch-games.mjs
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/games.js assets/covers
          git diff --cached --quiet || git commit -m "Update top 100 games from BoardGameGeek"
          git push
