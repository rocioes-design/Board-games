name: Update games from BoardGameGeek

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # every Monday morning (UTC)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-games.mjs
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/games.js
          git diff --cached --quiet || git commit -m "Update top 100 games from BoardGameGeek"
          git push
