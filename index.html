<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top 100 Board Games</title>
  <meta name="description" content="The 100 highest ranked board games on BoardGameGeek, one at a time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="landscape" aria-hidden="true"></div>

  <!-- gradients and textures shared by every card -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="meeple" viewBox="0 0 24 24"><path d="M12 2.5a3.4 3.4 0 0 1 3.4 3.4c0 .9-.3 1.6-.8 2.2 2.9.6 6.9 1.9 6.9 3.8 0 1.2-1.6 1.7-3.6 1.7l2.2 6.6c.2.6-.3 1.3-1 1.3h-3.6L12 17l-3.5 4.5H4.9c-.7 0-1.2-.7-1-1.3l2.2-6.6c-2 0-3.6-.5-3.6-1.7 0-1.9 4-3.2 6.9-3.8-.5-.6-.8-1.3-.8-2.2A3.4 3.4 0 0 1 12 2.5z"/></symbol>
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#e6c98d"/>
              <stop offset=".45" stop-color="#cfa760"/>
              <stop offset=".7" stop-color="#dcbb7a"/>
              <stop offset="1" stop-color="#b98f4a"/>
            </linearGradient>
            <!-- faint paper grain -->
            <filter id="paper" x="0" y="0" width="100%" height="100%">
              <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/>
              <feColorMatrix in="n" type="matrix" values="0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .12  0 0 0 .22 0" result="grain"/>
              <feComposite in="grain" in2="SourceGraphic" operator="in" result="g"/>
              <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="g"/></feMerge>
            </filter>
      <linearGradient id="starGold" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#ffe45c"/>
                  <stop offset=".55" stop-color="#fbc311"/>
                  <stop offset="1" stop-color="#f29d0a"/>
                </linearGradient>
    </defs>
  </svg>


  <main class="stage" aria-roledescription="carousel" aria-label="Top 100 board games">
    <button class="nav prev" type="button" aria-label="Previous game">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>

    <!-- the deck: the front card plus the next games fanned out behind it -->
    <div class="deck" aria-live="polite"></div>

    <button class="nav next" type="button" aria-label="Next game">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </main>

  <p class="counter"></p>
  <a class="credit" href="https://boardgamegeek.com" target="_blank" rel="noopener" aria-label="Powered by BoardGameGeek">
    Powered by
    <svg class="bgg-mark" viewBox="0 0 24 30" aria-hidden="true"><path d="M3 5.5 L17.5 1 L16.2 6.4 L21.5 5 L19.6 17.5 L21 18.6 L13.2 29 L4.2 25.6 Z"/></svg>
    BGG
  </a>

  <template id="card-template">
    <article class="card">
      <!-- ranking number on a golden label -->
      <div class="rank">
        <svg class="rank-tag" viewBox="0 0 100 150" aria-hidden="true">
          <rect x="1" y="1" width="98" height="148" rx="49" fill="url(#gold)" filter="url(#paper)"/>
          <rect x="6" y="6" width="88" height="138" rx="44" fill="none" stroke="#3f2d17" stroke-width="1.8"/>
          <rect x="9.5" y="9.5" width="81" height="131" rx="40.5" fill="none" stroke="#3f2d17" stroke-width=".7"/>
          <path d="M50 19 l3 3 -3 3 -3 -3z M50 125 l3 3 -3 3 -3 -3z" fill="#3f2d17"/>
          <text class="rank-caption" x="50" y="50">RANK</text>
          <path d="M34 106 h32" stroke="#3f2d17" stroke-width=".8"/>
          <path d="M50 103 l3 3 -3 3 -3 -3z" fill="#3f2d17"/>
          <text class="rank-text" x="50" y="92"></text>
        </svg>
        <span class="visually-hidden rank-label"></span>
      </div>
      <div class="art">
        <img alt="">
        <div class="placeholder"><span></span></div>
      </div>
      <div class="info">
        <div class="text">
          <h1><span class="name"></span> <span class="year"></span></h1>
          <p class="description"></p>
        </div>
        <div class="stats">
          <p class="rating">
            <svg viewBox="0 0 24 24" class="star" aria-hidden="true">
              <path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.1l-5.9 3.3 1.3-6.5-4.9-4.6 6.6-.8z"/></svg>
            <span class="rating-value"></span>
          </p>
          <!-- best player count: one meeple avatar per player, label on hover -->
          <div class="players" tabindex="0">
            <div class="avatars" aria-hidden="true"></div>
            <span class="players-tip" role="tooltip"></span>
          </div>
        </div>
      </div>
    </article>
  </template>

  <script src="data/games.js"></script>
  <script src="app.js"></script>
</body>
</html>
