<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top 100 Board Games</title>
  <meta name="description" content="The 100 highest ranked board games on BoardGameGeek, one at a time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Fredoka:wght@700&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Medieval landscape at golden hour -->
  <svg class="landscape" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8fb3c9"/>
        <stop offset=".45" stop-color="#d9cfb4"/>
        <stop offset=".7" stop-color="#f1d49a"/>
      </linearGradient>
      <radialGradient id="sun" cx="1180" cy="430" r="260" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fff6d8" stop-opacity=".95"/>
        <stop offset=".25" stop-color="#ffe7a8" stop-opacity=".55"/>
        <stop offset="1" stop-color="#ffe7a8" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f4e3bd" stop-opacity="0"/>
        <stop offset="1" stop-color="#f4e3bd" stop-opacity=".55"/>
      </linearGradient>
    </defs>

    <rect width="1600" height="900" fill="url(#sky)"/>
    <circle cx="1180" cy="430" r="260" fill="url(#sun)"/>
    <circle cx="1180" cy="430" r="46" fill="#fff4d2"/>

    <!-- clouds -->
    <g fill="#fdf6e6" opacity=".6">
      <ellipse cx="260" cy="150" rx="150" ry="22"/>
      <ellipse cx="330" cy="135" rx="90" ry="20"/>
      <ellipse cx="1330" cy="210" rx="170" ry="18"/>
      <ellipse cx="820" cy="95" rx="120" ry="14"/>
    </g>

    <!-- distant mountains -->
    <path fill="#a9b7bd" d="M0 470 L120 380 L210 430 L330 320 L450 420 L560 360 L700 450 L820 390 L960 460 L1080 370 L1200 440 L1330 350 L1460 430 L1600 380 V900 H0Z"/>
    <path fill="#a9b7bd" opacity=".5" d="M330 320 L360 345 L345 350Z M1330 350 L1360 372 L1340 376Z"/>
    <rect y="340" width="1600" height="200" fill="url(#haze)"/>

    <!-- far hills -->
    <path fill="#9aa98a" d="M0 540 C180 480 340 500 520 520 S860 470 1040 505 1380 470 1600 500 V900 H0Z"/>

    <!-- castle on the hill -->
    <g transform="translate(-190 104) scale(.8)">
    <g fill="#6f7a6c">
      <path d="M300 520 C380 440 560 430 660 520Z"/>
      <rect x="400" y="405" width="150" height="80"/>
      <rect x="380" y="360" width="38" height="125"/>
      <rect x="532" y="370" width="36" height="115"/>
      <rect x="455" y="330" width="40" height="155"/>
      <path d="M376 362 L399 322 L422 362Z M528 372 L550 334 L572 372Z M451 332 L475 282 L499 332Z"/>
      <path d="M400 405 h12 v-10 h14 v10 h14 v-10 h14 v10 h14 v-10 h14 v10 h14 v-10 h14 v10 h14 v-10 h14 v10 h12 v4 h-150Z"/>
      <rect x="474" y="258" width="2" height="26"/>
      <path d="M476 258 l18 5 -18 5Z" fill="#b8574a"/>
    </g>
    <g fill="#f3d28c" opacity=".85">
      <rect x="394" y="390" width="6" height="10" rx="3"/>
      <rect x="470" y="360" width="6" height="10" rx="3"/>
      <rect x="546" y="400" width="6" height="10" rx="3"/>
    </g>
    </g>

    <!-- middle hills with fields -->
    <path fill="#7f9a62" d="M0 610 C220 560 420 575 640 600 S1080 560 1300 580 1500 570 1600 575 V900 H0Z"/>
    <g stroke="#8fa96d" stroke-width="7" opacity=".7">
      <path d="M900 596 L1180 580 M910 614 L1200 598 M920 632 L1220 616"/>
    </g>
    <path fill="#c9ad6a" opacity=".55" d="M1240 585 C1320 575 1420 575 1500 582 L1490 620 C1400 612 1320 612 1250 622Z"/>

    <!-- windmill -->
    <g transform="translate(1390 520)">
      <path fill="#6d6152" d="M-14 70 L-9 10 L9 10 L14 70Z"/>
      <path fill="#5b4f43" d="M-12 10 L0 -4 L12 10Z"/>
      <g stroke="#5b4f43" stroke-width="4" stroke-linecap="round">
        <path d="M0 4 L-38 -34 M0 4 L38 -34 M0 4 L-38 42 M0 4 L38 42"/>
      </g>
    </g>

    <!-- near hills -->
    <path fill="#627f49" d="M0 700 C260 640 520 660 760 690 S1200 650 1600 680 V900 H0Z"/>

    <!-- winding path -->
    <path fill="#d8c08c" opacity=".8" d="M760 900 C800 820 700 780 760 740 S860 700 840 690 L852 690 C880 705 800 730 790 760 S860 840 850 900Z"/>

    <!-- forest -->
    <g fill="#3f5b36">
      <path d="M40 720 l22 -70 22 70Z M80 730 l26 -90 26 90Z M125 725 l20 -64 20 64Z M160 735 l24 -80 24 80Z M205 728 l18 -60 18 60Z"/>
      <path d="M1370 720 l20 -66 20 66Z M1410 728 l26 -88 26 88Z M1455 722 l20 -62 20 62Z M1490 732 l24 -84 24 84Z M1530 724 l22 -70 22 70Z"/>
    </g>
    <g fill="#35502e">
      <path d="M0 800 l30 -110 30 110Z M1540 810 l30 -120 30 120Z"/>
    </g>

    <!-- village cottages -->
    <g transform="translate(980 640)">
      <rect x="0" y="16" width="34" height="22" fill="#e6d6b4"/>
      <path d="M-4 18 L17 0 L38 18Z" fill="#9c5b3f"/>
      <rect x="46" y="22" width="28" height="18" fill="#e6d6b4"/>
      <path d="M42 24 L60 8 L78 24Z" fill="#8a4f37"/>
    </g>

    <!-- foreground -->
    <path fill="#4c6a3a" d="M0 800 C300 760 600 790 900 800 S1400 770 1600 790 V900 H0Z"/>
  </svg>

  <main class="stage" aria-roledescription="carousel" aria-label="Top 100 board games">
    <button class="nav prev" type="button" aria-label="Previous game">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>

    <article class="card" aria-live="polite">
      <span class="rank" aria-label="Rank"></span>
      <div class="art">
        <img alt="">
        <div class="placeholder"><span></span></div>
      </div>
      <div class="info">
        <div class="text">
          <h1><span class="name"></span> <span class="year"></span></h1>
          <p class="description"></p>
        </div>
        <div class="stats">
          <p class="rating">
            <svg viewBox="0 0 24 24" class="star" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.1l-5.9 3.3 1.3-6.5-4.9-4.6 6.6-.8z"/></svg>
            <span class="rating-value"></span>
          </p>
          <p class="players">
            <!-- meeple -->
            <svg viewBox="0 0 24 24" class="meeple" aria-hidden="true"><path d="M12 2.5a3.4 3.4 0 0 1 3.4 3.4c0 .9-.3 1.6-.8 2.2 2.9.6 6.9 1.9 6.9 3.8 0 1.2-1.6 1.7-3.6 1.7l2.2 6.6c.2.6-.3 1.3-1 1.3h-3.6L12 17l-3.5 4.5H4.9c-.7 0-1.2-.7-1-1.3l2.2-6.6c-2 0-3.6-.5-3.6-1.7 0-1.9 4-3.2 6.9-3.8-.5-.6-.8-1.3-.8-2.2A3.4 3.4 0 0 1 12 2.5z"/></svg>
            <span class="players-value"></span>
          </p>
        </div>
      </div>
    </article>

    <button class="nav next" type="button" aria-label="Next game">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </main>

  <p class="counter"></p>

  <script src="data/games.js"></script>
  <script src="app.js"></script>
</body>
</html>
